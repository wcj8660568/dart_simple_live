name: Build Simple Live

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ 修复1：设置 JDK 17 (AGP 8.7+ 必须)
      # ✅ 修复2：升级到 v5 消除截图中的警告
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # ✅ 核心修复：锁定为 3.29.0 (Stable)
          # 之前报错是因为云端跑在了 Beta 版上，导致 SDK 版本校验失败
          flutter-version: '3.29.0' 
          channel: stable
          cache: true

      # 这里的步骤保持不变
      - name: Install core dependencies
        run: |
          cd simple_live_core
          flutter pub get

      - name: Install app dependencies
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk

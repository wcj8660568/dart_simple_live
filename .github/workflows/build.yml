name: Build Simple Live

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ 修复1：设置 JDK 17 (AGP 8.7+ 必须)
      # ✅ 修复2：升级到 v5 消除 Node.js 警告
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # ✅ 核心修复：指定 3.29.0 以获取 Dart 3.10+
          flutter-version: '3.29.0' 
          channel: stable
          cache: true

      # 这里的逻辑保持不变，先装 core 再装 app
      - name: Install core dependencies
        run: |
          cd simple_live_core
          flutter pub get

      - name: Install app dependencies
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          # 增加 --no-tree-shake-icons 防止部分图标字体在云构建报错，可选
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk

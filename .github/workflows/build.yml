name: Build Simple Live

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ 修复1：设置 JDK 17 (AGP 8.7+ 必须)
      # ✅ 修复2：升级到 v5 消除 Node.js 警告
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # ✅ 核心修复：使用正确的版本号 3.47.1 (对应 Dart 3.10+)
          flutter-version: '3.47.1' 
          channel: stable
          cache: true

      - name: Install core dependencies
        run: |
          cd simple_live_core
          flutter pub get

      - name: Install app dependencies
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
